name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        
    - run: npm ci

    # tests/auth-http.test.mjs spawns the built server to prove an
    # unauthenticated API call is refused, so it throws unless `.next` exists.
    # Without this step it failed on every run while passing on any machine
    # that had ever built the app.
    - run: npm run build

    - run: npm test
