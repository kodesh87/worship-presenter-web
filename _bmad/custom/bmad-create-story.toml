# Team override for bmad-create-story — [[Planning pipeline automation]]
# See README-bmad-automation.md for the source idea.
#
# Gate 1 (create-story must succeed with no follow-up before validate runs) is free:
# on_complete below only fires if the base workflow reaches Step 6 cleanly — any HALT
# earlier in the workflow (missing docs, bad epic status, etc.) never reaches it.
# Gate 2 (validate must succeed with no follow-up before commit/push/PR) is enforced
# explicitly in on_complete step 2.

[workflow]

# Gives this skill a real "validate" argument mode: a fresh, independent re-audit of
# an already-created story against checklist.md, run in isolation from whatever
# context created the story. Triggered by invoking this skill with args = "validate".
activation_steps_prepend = [
  """If this invocation's arguments are exactly (or clearly mean) 'validate': skip the rest of activation and the entire normal create-story workflow. Instead, run ONLY this validate pass:
  1. Determine the target story the same way the normal workflow would — an explicit story path/epic-story number if one was given alongside 'validate', otherwise the story in {{sprint_status}} most recently set to 'ready-for-dev'.
  2. Load that story file in full.
  3. Independently re-check it against every item in {skill-root}/checklist.md. Treat this as a fresh audit, not a rubber stamp: you may not be the context that wrote it, and even if you are, do not assume your own earlier self-check was sufficient. For each checklist item, state satisfied/not-satisfied, and if not satisfied, name the exact section or line that is missing, vague, or wrong.
  4. End your entire response with exactly one final line: 'VALIDATE_OK — no follow-up needed' (only if every item is genuinely satisfied), or 'VALIDATE_FOLLOWUP —' followed by a concrete numbered list of what must be fixed.
  5. HALT after reporting. Do not create or modify any story file, do not touch {{sprint_status}}, do not run on_complete.""",
]

on_complete = """
Story creation reached this point cleanly (no follow-up needed) — that is the only way
execution gets here at all; any earlier HALT skips this entirely. Do the following, in
order, before finishing:

1. INDEPENDENT VALIDATION — must run in a fresh, unbiased context, not this one.
   Dispatch a brand-new subagent (Agent tool, model: sonnet) that has NOT seen this
   conversation. Its ONLY instruction: invoke this same skill again as
   `Skill(skill: "bmad-create-story", args: "validate {{story_key}}")`, then report
   back that invocation's full output verbatim — nothing else, no summarizing.

   Wait for the subagent's full report before continuing to step 2.

2. Read the subagent's report verbatim.
   - If it ends with 'VALIDATE_FOLLOWUP', STOP here. Show {user_name} the full report.
     Do NOT run the guard test, do NOT commit, do NOT push, do NOT open a PR. The
     story stays as-is until the follow-ups are addressed and validate is re-run clean.
   - Only if it ends with 'VALIDATE_OK — no follow-up needed', continue to step 3.

3. Run the mandatory public-repo commit/push audit:
   `node --import ./tests/register-ts-resolve.mjs --test --experimental-strip-types tests/public-repo-guard.test.mjs`

   If the guard test fails:
   - Stop here. Do NOT stage, commit, or push anything.
   - Report the failing test output verbatim to {user_name}.
   - Never weaken or skip the guard to make it pass — the finding is the point.

4. If the guard test passes:
   a. Create and checkout a new branch from the current branch, named
      `docs/story-{{story_id}}-context` (replace any "." in {{story_id}} with "-",
      e.g. story 23.1 -> `docs/story-23-1-context`).
   b. Stage ONLY {{story_file}} and {{sprint_status}} — never `git add -A` or `git add .`.
      Refuse to stage anything under data/local/, data/uploads/, slides*/, *.pptx, *.potx,
      .env*, or data.db* if they somehow appear in the diff.
   c. Commit with message:
      `docs: create Story {{story_id}} context`
      followed by a one-line body naming the story, and a
      `Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>` trailer.
   d. Push the branch to origin with `-u`.
   e. Open a PR with `gh pr create` targeting the repository's default branch.
      Title: `docs: create Story {{story_id}} context`
      Body: 2-3 bullet summary of the story + a line confirming both the independent
      validation and the guard test passed.
   f. Report the PR URL to {user_name}.
"""
