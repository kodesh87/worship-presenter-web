    status: partially-done # 2026-07-30 bmad-architecture Update ran on architecture-epic-16. SPINE HALF DONE, EXPERIENCE.md HALF STILL OPEN — the item asked for both in one change set and only one landed, so it is not closed. Delivered: AD-16 supersedes ONLY the "global across services" clause of AD-14 (admin-only authorization and read-through-server-side-modules clauses stand; AD-4 LiveServer durable paths is a different decision and untouched). Owner decided Sync is permitted on any service including one already presented, and CORRECTED the rationale on 2026-07-30: the freeze event is service CREATION (a service is self-contained against the registry from adoption), and what is frozen is the supporting data entry — sermon speaker, sermon flyer, hymnal number per slot — not the generated deck. So there is no historical-fidelity cost to accept; three deliberate non-goals follow instead: Sync is unrestricted, Announcement membership stays live from the master list, and a later structural change need not keep an old snapshot renderable. Three more decisions landed because the gate found them: AD-17 (seed is bootstrap-once — resolves the previously unrecorded AD-11 vs CAP-2 collision where a deleted row left no evidence and was resurrected every boot via insertArtifactTemplateIfMissing), AD-18 (value migrations are explicit and marker-gated, precedent artifact_seed_hash_backfilled; the seven-to-three base_type collapse is a total replacement with no incremental migration under an owner waiver that EXPIRES AT FIRST DEPLOY), AD-19 (a cross-boundary key is a server-owned value the administrator cannot edit — closes the SongSet-slot-to-hymn-number binding and the Placeholder Catalog key set, which both reviewer lenses found independently). AD-19's SongSet half uses the OWNER'S mechanism, decided 2026-07-30 and simpler than the reviewer's proposal: the binding key is the slot's own immutable identity carried by the type vocabulary (songset-bt-open / -bt-close / -ds-open /